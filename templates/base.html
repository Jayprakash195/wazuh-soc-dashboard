<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · Wazuh SOC Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head>
<body data-page="{{ page }}">
<aside><h2>&#9919; SOC Lab</h2>
<nav>{% for path, (name, key) in pages.items() %}<a href="/{{ path }}" class="{{ 'on' if key == page }}">{{ name }}</a>{% endfor %}</nav>
<div id="modebadge" class="badge">…</div></aside>
<main><h1>{{ title }}</h1><div id="view">Loading…</div></main>
<div id="modal" class="modal" hidden><div class="card" id="modalbody"></div></div>
<script src="{{ url_for('static', filename='charts.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
